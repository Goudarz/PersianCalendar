name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch toolchain and runtime changes

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: data files are up to date and match the official table
        run: cargo run --release -- --check && cargo test --release
        working-directory: tools/calendar-data
      - run: cargo fmt --check && cargo clippy --release -- -D warnings
        working-directory: tools/calendar-data

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m unittest discover -s implementations/python -v

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', 'latest']   # different built-in ICU versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: node --test
        working-directory: implementations/javascript
      - run: node --test persian-calendar.test.ts
        working-directory: implementations/typescript
      - run: npx -y -p typescript tsc --noEmit --strict --target es2022 --module nodenext --allowImportingTsExtensions persian-calendar.ts
        working-directory: implementations/typescript

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: javac -encoding UTF-8 -d out *.java && java -cp out PersianCalendarTest
        working-directory: implementations/java

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: fwilhe2/setup-kotlin@v2.0
      - run: kotlinc PersianCalendar.kt PersianCalendarTest.kt -include-runtime -d t.jar && java -jar t.jar ../../data
        working-directory: implementations/kotlin

  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: VirtusLab/scala-cli-setup@v1.17
      - run: scala-cli run . --main-class persiancalendar.PersianCalendarTest -- ../../data
        working-directory: implementations/scala

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run -c Release
        working-directory: implementations/csharp/tests
        env:
          DATA_DIR: ${{ github.workspace }}/data

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: implementations/go
      - name: 32-bit int (GOARCH=386)
        run: GOARCH=386 go vet ./... && GOARCH=386 go test ./...
        working-directory: implementations/go

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check && cargo clippy --release -- -D warnings && cargo test --release
        working-directory: implementations/rust

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: php test.php
        working-directory: implementations/php

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get && dart analyze --fatal-infos && dart test
        working-directory: implementations/dart
      - name: compiled to JavaScript (web int semantics)
        run: dart test -p node
        working-directory: implementations/dart

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 persian_calendar.c test.c -o t && ./t ../../data
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -c persian_calendar.c -o /tmp/pc.o
        working-directory: implementations/c
      - name: undefined-behavior and address sanitizers
        run: cc -std=c99 -O1 -g -fsanitize=undefined,address -fno-sanitize-recover=all persian_calendar.c test.c -o ts && ./ts ../../data
        working-directory: implementations/c

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem install minitest && ruby test_persian_calendar.rb
        working-directory: implementations/ruby

  postgresql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install && npm test
        working-directory: implementations/sql

  icu-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ICU4X (icu_calendar, calendrical_calculations), every day 1178-3000
        run: cargo run --release
        working-directory: tools/icu-cross-check/rust
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: ICU4C via Node.js 24 Intl
        run: node check.mjs
        working-directory: tools/icu-cross-check/javascript
      - uses: actions/setup-node@v4
        with: { node-version: 'latest' }
      - name: ICU4C via latest Node.js Intl, and Temporal (JavaScript and TypeScript)
        run: node check.mjs && node check.mjs typescript
        working-directory: tools/icu-cross-check/javascript
      - name: PostgreSQL functions (PGlite) against Intl and Temporal
        run: npm install && node check.mjs
        working-directory: tools/icu-cross-check/postgresql
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: ICU4J 76.1, 77.1, 78.3, 79.1
        working-directory: tools/icu-cross-check/java
        run: |
          for v in 76.1 77.1 78.3 79.1; do
            curl -sSfL -o icu4j-$v.jar https://repo1.maven.org/maven2/com/ibm/icu/icu4j/$v/icu4j-$v.jar
            rm -rf out && javac -cp icu4j-$v.jar -d out IcuCheck.java ../../../implementations/java/PersianCalendar.java
            java -cp "icu4j-$v.jar:out" IcuCheck ../../../data/years.csv
          done
      - uses: fwilhe2/setup-kotlin@v2.0
      - name: ICU4J 76.1 and 79.1 from Kotlin
        working-directory: tools/icu-cross-check/kotlin
        run: |
          kotlinc -cp ../java/icu4j-79.1.jar IcuCheck.kt ../../../implementations/kotlin/PersianCalendar.kt -include-runtime -d check.jar
          for v in 76.1 79.1; do java -cp "../java/icu4j-$v.jar:check.jar" IcuCheckKt ../../../data/years.csv; done
      - uses: VirtusLab/scala-cli-setup@v1.17
      - name: ICU4J 76.1 and 79.1 from Scala
        working-directory: tools/icu-cross-check/scala
        run: |
          for v in 76.1 79.1; do
            scala-cli run IcuCheck.scala ../../../implementations/scala/PersianCalendar.scala --dep com.ibm.icu:icu4j:$v               --main-class IcuCheck -- ../../../data/years.csv
          done
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: intl }
      - name: ICU4C via PHP intl (system ICU)
        run: php check.php
        working-directory: tools/icu-cross-check/php
      - name: ICU4C C API from Python (ctypes), system ICU
        run: python3 check.py
        working-directory: tools/icu-cross-check/python
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: ICU4C C API from Ruby (Fiddle), system ICU
        run: ruby check.rb
        working-directory: tools/icu-cross-check/ruby
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: ICU4C C API from Go (purego), system ICU
        run: CGO_ENABLED=0 go run .
        working-directory: tools/icu-cross-check/go
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: ICU4C C API from C# (P/Invoke), system ICU; .NET PersianCalendar reported
        run: dotnet run -c Release
        working-directory: tools/icu-cross-check/csharp
      - uses: dart-lang/setup-dart@v1
      - name: ICU4C C API from Dart (dart:ffi), system ICU
        run: dart pub get && dart run bin/check.dart
        working-directory: tools/icu-cross-check/dart
      - name: ICU4C C API from C (dlopen), system ICU
        working-directory: tools/icu-cross-check/c
        run: |
          dir=/usr/lib/x86_64-linux-gnu
          major=$(ls $dir/libicui18n.so.[0-9]* | sed -E 's/.*[.]so[.]([0-9]+).*/\1/' | sort -n | tail -1)
          cc -std=c99 -Wall -Wextra -Werror -O2 check.c ../../../implementations/c/persian_calendar.c -o check -ldl
          ./check $dir $major
